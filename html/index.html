<!doctype html>
<!-- Define que este documento utiliza HTML5. -->

<html lang="pt-BR">
<!-- Inicia o documento e informa que o idioma é português do Brasil. -->

<head>
    <!-- Inicia a área de configurações da página. -->

    <meta charset="UTF-8" />
    <!-- Permite utilizar acentos e caracteres especiais. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Faz a página se adaptar a celulares, tablets e computadores. -->

    <title>Lista de Tarefas</title>
    <!-- Define o título que aparecerá na aba do navegador. -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png" />

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../javascript/script.js" defer></script>
</head>
<!-- Finaliza a área de configurações. -->

<body>
    <!-- Inicia o conteúdo visível da página. -->

    <main class="container">
        <!-- Cria o container principal da aplicação. -->

        <h1>Minha Lista de Tarefas</h1>
        <!-- Exibe o título principal. -->

        <p class="descricao">Adicione, conclua, filtre e exclua tarefas.</p>
        <!-- Exibe uma pequena descrição da aplicação. -->

        <section class="formulario">
            <!-- Agrupa o campo de texto e o botão de adicionar. -->

            <input type="text" id="campoTarefa" placeholder="Digite uma tarefa..." />
            <!--
                Cria o campo onde o usuário digitará
                uma nova tarefa.
            -->

            <button id="btnAdicionar">Adicionar</button>
            <!-- Cria o botão responsável por adicionar a tarefa. -->
        </section>
        <!-- Finaliza a área de cadastro. -->

        <section class="controles">
            <!-- Agrupa os botões utilizados para filtrar as tarefas. -->

            <button class="filtro ativo" data-filtro="todas">Todas</button>
            <!-- Botão que mostra todas as tarefas. -->

            <button class="filtro" data-filtro="pendentes">Pendentes</button>
            <!-- Botão que mostra somente tarefas pendentes. -->

            <button class="filtro" data-filtro="concluidas">Concluídas</button>
            <!-- Botão que mostra somente tarefas concluídas. -->
        </section>
        <!-- Finaliza a área de filtros. -->

        <ul id="listaTarefas"></ul>
        <!--
            Lista vazia.
            O JavaScript criará os elementos <li>
            dinamicamente dentro dela.
        -->

        <div class="resumo">
            <!-- Cria a área de resumo da aplicação. -->

            <span id="contador"> 0 tarefas </span>
            <!-- Mostra a quantidade de tarefas cadastradas. -->

            <button id="btnLimpar">Limpar concluídas</button>
            <!-- Botão responsável por remover tarefas concluídas. -->
        </div>
        <!-- Finaliza a área de resumo. -->
    </main>
    <!-- Finaliza o conteúdo principal. -->

</body>
<!-- Finaliza o corpo da página. -->

</html>
<!-- Finaliza o documento HTML. -->
